name: Windows EXE

# Kézzel indítható (Actions → Windows EXE → Run workflow), vagy egy v* címke
# (pl. v4.4) feltöltésekor lefut, és a kész EXE-t a GitHub Release-hez csatolja.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Függőségek
        run: python -m pip install -r requirements.txt pyinstaller
      - name: EXE készítése
        shell: pwsh
        run: |
          $data = @()
          foreach ($png in Get-ChildItem -Filter *.png) { $data += @("--add-data", "$($png.Name);.") }
          pyinstaller --noconfirm --noconsole --onefile --name MediaRenamerPro `
            @data --collect-data sv_ttk --collect-all tkinterdnd2 `
            --hidden-import PIL._tkinter_finder Keprename5video.py
      - uses: actions/upload-artifact@v4
        with:
          name: MediaRenamerPro-windows
          path: dist/MediaRenamerPro.exe
      - name: Csatolás a Release-hez
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/MediaRenamerPro.exe --clobber
